<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>배합 단가 산출</title>
  <style>
    :root {
      --blue: #1565c0;
      --blue-light: #e3f0ff;
      --green: #2e7d32;
      --green-light: #e8f5e9;
      --orange: #e65100;
      --orange-light: #fff3e0;
      --gray: #546e7a;
      --border: #e0e0e0;
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #212121;
      --muted: #757575;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      padding-bottom: 50px;
    }

    /* ─── Header ─── */
    header {
      background: var(--blue);
      color: white;
      padding: 14px 16px 12px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .header-row { display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
    header p  { font-size: 11px; opacity: 0.75; margin-top: 2px; }
    .reset-btn {
      padding: 5px 12px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 20px;
      color: white;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .reset-btn:active { background: rgba(255,255,255,0.3); }
    .save-btn {
      padding: 5px 12px;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 20px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .save-btn:active { background: white; }

    /* ─── Save Modal ─── */
    .modal-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 50;
      align-items: flex-end;
    }
    .modal-backdrop.on { display: flex; }
    .modal-sheet {
      background: white;
      width: 100%;
      border-radius: 18px 18px 0 0;
      padding: 16px 16px 24px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
    }
    .modal-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; color: var(--text); }
    .slot-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .slot-info { flex: 1; }
    .slot-name { font-size: 13px; font-weight: 700; color: var(--text); }
    .slot-time { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .slot-actions { display: flex; gap: 5px; }
    .slot-btn {
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      white-space: nowrap;
    }
    .slot-btn.save   { background: var(--blue-light);  color: var(--blue); }
    .slot-btn.load   { background: var(--green-light); color: var(--green); }
    .slot-btn.del    { background: #ffebee; color: #c62828; }
    .slot-btn.rename { background: #f5f5f5; color: var(--muted); }
    .slot-btn:active { opacity: 0.7; }
    #slotList { max-height: 60vh; overflow-y: auto; }
    .modal-close {
      width: 100%; padding: 11px;
      background: #f5f5f5; border: none;
      border-radius: 10px; font-size: 14px;
      font-weight: 600; color: var(--muted);
      cursor: pointer; margin-top: 4px;
    }
    .modal-close:active { background: #e0e0e0; }

    .wrap { padding: 12px; }

    /* ─── Mix selector ─── */
    .mix-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card);
      padding: 10px 14px;
      position: sticky;
      top: 56px;
      z-index: 9;
      border-radius: 12px 12px 0 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .mix-bar::-webkit-scrollbar { display: none; }
    .mix-btn {
      padding: 6px 13px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: white;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .mix-btn.active { background: var(--blue); border-color: var(--blue); color: white; }
    .mix-btn:active { opacity: 0.7; }

    /* ─── Cards ─── */
    .card {
      background: var(--card);
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.09);
    }
    .card.top { border-radius: 0 0 12px 12px; margin-bottom: 12px; }
    .card.mid { border-radius: 12px; margin-bottom: 12px; }

    .card-head {
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-head.blue { background: var(--blue); }
    .card-head.gray { background: var(--gray); }
    .card-head small { font-size: 11px; font-weight: 400; opacity: 0.8; }

    .mix-name-edit {
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 6px;
      padding: 3px 8px;
      cursor: pointer;
      display: flex; align-items: center; gap: 4px;
      color: white;
      font-size: 11px;
      font-weight: 600;
    }
    .mix-name-edit:active { background: rgba(255,255,255,0.35); }

    /* ─── Table ─── */
    table { width: 100%; border-collapse: collapse; }

    thead th {
      background: #f5f7ff;
      padding: 7px 4px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
    }

    tbody td {
      padding: 5px 3px;
      border-bottom: 1px solid #f5f5f5;
      vertical-align: middle;
    }
    td.lbl { font-size: 12px; padding-left: 12px; white-space: nowrap; }
    td.val { text-align: right; padding-right: 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
    td.val.hi { color: var(--blue); }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 6px 5px;
      font-size: 12px;
      text-align: right;
      background: #fafafa;
      color: var(--text);
      -webkit-appearance: none;
      appearance: none;
    }
    input[type="text"] { font-size: 11px; }
    input:focus { outline: none; border-color: var(--blue); background: #fff; }

    .del-btn {
      display: flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; margin: 0 auto;
      background: #ffebee; border: none; border-radius: 50%;
      color: #c62828; font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .del-btn:active { background: #c62828; color: #fff; }

    tr.r-sub td       { background: #f0f4ff; }
    tr.r-sub td.lbl   { font-weight: 700; color: var(--blue); }
    tr.r-sub td.val   { color: var(--blue); }
    tr.r-total td     { background: #dce8ff; }
    tr.r-total td.lbl { font-weight: 700; font-size: 13px; color: var(--blue); }
    tr.r-total td.val { font-size: 13px; font-weight: 700; color: var(--blue); }
    tr.r-delivery td     { background: var(--green-light); }
    tr.r-delivery td.lbl { font-weight: 700; color: var(--green); }
    tr.r-profit td     { background: var(--orange-light); }
    tr.r-profit td.lbl { font-weight: 700; color: var(--orange); }
    tr.r-profit td.val { font-size: 14px; }
    tr.r-shared td     { background: #fff8e1; }
    tr.r-shared td.lbl { font-weight: 700; color: #f57f17; }

    .warn { display: none; font-size: 11px; color: #c62828; padding: 4px 12px; background: #ffebee; }
    .warn.on { display: block; }

    .add-btn {
      display: block; width: calc(100% - 24px); margin: 8px 12px;
      padding: 9px; background: none; border: 1.5px dashed var(--border);
      border-radius: 8px; font-size: 13px; font-weight: 600;
      color: var(--muted); cursor: pointer;
    }
    .add-btn:active { border-color: var(--blue); color: var(--blue); }

    .hint { font-size: 10px; color: #9e9e9e; padding: 3px 12px 4px; }

    /* ─── Comparison table ─── */
    .sec-title {
      font-size: 11px; font-weight: 700; color: var(--muted);
      letter-spacing: 0.5px; text-transform: uppercase; padding: 4px 2px 6px;
    }
    .cmp-table { width: 100%; border-collapse: collapse; }
    .cmp-table th {
      background: #f5f7ff;
      padding: 7px 8px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      text-align: right;
      border-bottom: 1px solid var(--border);
    }
    .cmp-table th:first-child { text-align: left; }
    .cmp-table td {
      padding: 8px 8px;
      font-size: 12px;
      font-weight: 600;
      text-align: right;
      border-bottom: 1px solid #f5f5f5;
      vertical-align: middle;
    }
    .cmp-table td:first-child { text-align: left; font-weight: 700; }
    .cmp-table tr.active-row td { background: var(--blue-light); }
    .cmp-table td.profit-pos { color: var(--orange); }
    .cmp-table td.profit-neg { color: #c62828; }
    .cmp-table td.muted { color: var(--muted); font-weight: 400; }

    /* ─── Print ─── */
    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      @page { size: A4; margin: 8mm; }
      body { background: white; padding-bottom: 0; font-size: 10px; }
      header { position: static; box-shadow: none; padding: 4px 10px; }
      header h1 { font-size: 13px; }
      header p  { font-size: 9px; }
      .reset-btn, .save-btn { display: none; }
      .mix-bar { position: static; box-shadow: none; border-radius: 0; padding: 6px 10px; }
      .mix-btn  { width: 26px; height: 26px; font-size: 12px; }
      .mix-name-edit { display: none; }
      .wrap { padding: 6px; }
      .add-btn, .del-btn { display: none; }
      .warn { display: none !important; }
      .hint { display: none; }
      .card { box-shadow: none; border: 1px solid #e0e0e0; margin-bottom: 6px !important; }
      thead th, .cmp-table th { padding: 4px 3px; font-size: 10px; }
      tbody td, .cmp-table td { padding: 3px 2px; font-size: 10px; }
      td.lbl { font-size: 10px; }
      td.val  { font-size: 10px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-row">
    <h1>배합 단가 산출</h1>
    <div style="display:flex;gap:6px">
      <button class="save-btn" onclick="openSaveModal()">저장 및 불러오기</button>
      <button class="reset-btn" onclick="resetAll()">초기화</button>
    </div>
  </div>
  <p>단위: 톤 &nbsp;|&nbsp; 금액 단위: 원/톤</p>
</header>

<div class="wrap">

  <div class="mix-bar" id="mixBar"></div>

  <div class="card top">
    <div class="card-head blue">
      <span id="mixNameDisplay">배합 ①</span>
      <button class="mix-name-edit" onclick="renameMix()">
        <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        이름 변경
      </button>
    </div>
    <table>
      <thead><tr>
        <th style="width:30%">원 료 명</th>
        <th style="width:22%">단 가</th>
        <th style="width:17%">배합%</th>
        <th style="width:22%">금 액</th>
        <th style="width:9%"></th>
      </tr></thead>
      <tbody id="matMain"></tbody>
    </table>
    <button class="add-btn" onclick="addMaterial()">＋ 원료 추가</button>
    <div class="warn" id="warnMain">⚠ 배합% 합계가 100%가 아닙니다</div>
    <table><tbody>
      <tr class="r-sub">
        <td class="lbl" colspan="2">소계</td>
        <td class="val" id="sm_pct" style="font-size:11px">-</td>
        <td class="val hi" id="sm_sub">-</td>
        <td></td>
      </tr>
      <tr class="r-total">
        <td class="lbl" colspan="2">합계</td>
        <td></td>
        <td class="val" id="sm_total">-</td>
        <td></td>
      </tr>
      <tr class="r-profit">
        <td class="lbl" colspan="2">매출이익</td>
        <td></td>
        <td class="val" id="sm_profit">-</td>
        <td></td>
      </tr>
    </tbody></table>
    <div class="hint" id="sm_hint"></div>
  </div>

  <!-- 공통 비용 -->
  <div class="card mid">
    <div class="card-head gray">
      <span>공통 비용 / 납품</span>
      <small>①~⑤ 동일 적용</small>
    </div>
    <table><tbody>
      <tr>
        <td class="lbl" style="width:50%">임가공비</td>
        <td><input type="text" id="proc" placeholder="0" inputmode="numeric" onfocus="stripInputOnFocus(this)" onblur="formatInputOnBlur(this)" oninput="calc()"></td>
      </tr>
      <tr>
        <td class="lbl">톤백자재비</td>
        <td><input type="text" id="bag" placeholder="0" inputmode="numeric" onfocus="stripInputOnFocus(this)" onblur="formatInputOnBlur(this)" oninput="calc()"></td>
      </tr>
      <tr>
        <td class="lbl">운반비</td>
        <td><input type="text" id="trans" placeholder="0" inputmode="numeric" onfocus="stripInputOnFocus(this)" onblur="formatInputOnBlur(this)" oninput="calc()"></td>
      </tr>
      <tr class="r-shared">
        <td class="lbl">추가운반비</td>
        <td><input type="text" id="extra" placeholder="0" inputmode="numeric" onfocus="stripInputOnFocus(this)" onblur="formatInputOnBlur(this)" oninput="calc()"></td>
      </tr>
      <tr class="r-delivery">
        <td class="lbl">납품단가</td>
        <td><input type="text" id="del" placeholder="직접 입력" inputmode="numeric" onfocus="stripInputOnFocus(this)" onblur="formatInputOnBlur(this)" oninput="calc()"></td>
      </tr>
    </tbody></table>
  </div>

  <!-- 비교 요약 -->
  <div class="sec-title">— 비교 요약 —</div>
  <div class="card mid">
    <table class="cmp-table">
      <thead>
        <tr>
          <th>배합</th>
          <th>원가 (원/톤)</th>
          <th>매출이익</th>
          <th>이익률</th>
        </tr>
      </thead>
      <tbody id="cmpBody"></tbody>
    </table>
  </div>

</div>

<!-- 임시저장 모달 -->
<div class="modal-backdrop" id="saveModal" onclick="onBackdropClick(event)">
  <div class="modal-sheet">
    <div class="modal-title">임시저장 슬롯</div>
    <div id="slotList"></div>
    <button class="modal-close" onclick="closeSaveModal()">닫기</button>
  </div>
</div>

<script>
const INIT_ROWS = [
  '포틀랜드시멘트',
  '고로슬래그미분말',
  '천연무수석고',
  '탈황석고',
  '플라이애시_EP',
  '플라이애시',
];
const MIX_COUNT = 5;
const MIX_NUM   = ['①','②','③','④','⑤'];

let activeTab = 0;
let rows = INIT_ROWS.map(name => ({ name, price: '', r: Array(MIX_COUNT).fill('') }));

/* ─── 숫자 포맷 ─── */
function fmt(n) {
  if (n == null || isNaN(n) || n === 0) return '-';
  return Math.round(n).toLocaleString('ko-KR');
}
function parseNum(v) {
  return parseFloat(String(v || '').replace(/,/g, '')) || 0;
}
function fmtInput(v) {
  const n = parseFloat(String(v || '').replace(/,/g, ''));
  return (n && !isNaN(n)) ? Math.round(n).toLocaleString('ko-KR') : '';
}
function formatInputOnBlur(el) { el.value = fmtInput(el.value); }
function stripInputOnFocus(el) {
  const n = parseFloat(String(el.value).replace(/,/g, ''));
  el.value = (n && !isNaN(n)) ? String(Math.round(n)) : '';
}

/* ─── 배합 이름 ─── */
const MIX_NAME_KEY = 'bct_mix_name_';
// 인메모리 배열 — localStorage는 초기 로드·renameMix에서만 동기화
let mixNames = Array.from({length: MIX_COUNT}, (_, i) => localStorage.getItem(MIX_NAME_KEY + i) || null);
function getMixName(i) {
  return mixNames[i] || `${i + 1}번 배합`;
}
function renameMix() {
  const current = getMixName(activeTab);
  const next = prompt(`배합 이름 변경`, current);
  if (next === null) return;
  const trimmed = next.trim();
  const isDefault = trimmed === '' || trimmed === `${activeTab + 1}번 배합`;
  mixNames[activeTab] = isDefault ? null : trimmed;
  if (isDefault) localStorage.removeItem(MIX_NAME_KEY + activeTab);
  else localStorage.setItem(MIX_NAME_KEY + activeTab, trimmed);
  updateMixHead();
  renderComparison(lastResults);
}
function renderMixBar() {
  document.getElementById('mixBar').innerHTML = Array.from({length: MIX_COUNT}, (_, i) =>
    `<button class="mix-btn${i === activeTab ? ' active' : ''}" onclick="switchMix(${i})">${getMixName(i)}</button>`
  ).join('');
}
function updateMixHead() {
  document.getElementById('mixNameDisplay').textContent = getMixName(activeTab);
  renderMixBar();
}

/* ─── 행 관리 ─── */
function saveCurrentRatios() {
  rows.forEach((row, i) => {
    const re = document.getElementById(`r_ratio_${i}`);
    if (re) row.r[activeTab] = re.value;
    const ne = document.getElementById(`r_name_${i}`);
    if (ne) row.name = ne.value;
    const pe = document.getElementById(`r_price_${i}`);
    if (pe) row.price = String(pe.value).replace(/,/g, '');
  });
}

function renderRows() {
  const tbody = document.getElementById('matMain');
  tbody.innerHTML = '';
  rows.forEach((row, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML =
      `<td style="padding:4px 3px 4px 5px">
         <input type="text" id="r_name_${i}" value="${row.name}" placeholder="원료명"
           style="text-align:left" oninput="onNameInput(${i},this.value)">
       </td>
       <td style="padding:4px 3px">
         <input type="text" id="r_price_${i}" value="${fmtInput(row.price)}" placeholder="0"
           inputmode="numeric"
           onfocus="stripInputOnFocus(this)"
           onblur="formatInputOnBlur(this)"
           oninput="onPriceInput(${i},this.value.replace(/,/g,''))">
       </td>
       <td style="padding:4px 3px">
         <input type="number" id="r_ratio_${i}" value="${row.r[activeTab]}" placeholder="0"
           inputmode="decimal" oninput="onRatioInput(${i},this.value)">
       </td>
       <td class="val hi" id="r_amt_${i}" style="min-width:56px">-</td>
       <td style="padding:3px 4px 3px 0; text-align:center">
         <button class="del-btn" onclick="deleteMaterial(${i})">✕</button>
       </td>`;
    tbody.appendChild(tr);
  });
}

function onNameInput(i, val)  { rows[i].name = val; calc(); }
function onPriceInput(i, val) { rows[i].price = val; calc(); }
function onRatioInput(i, val) { rows[i].r[activeTab] = val; calc(); }

function addMaterial() {
  saveCurrentRatios();
  rows.push({ name: '', price: '', r: Array(MIX_COUNT).fill('') });
  renderRows();
  calc();
}
function deleteMaterial(i) {
  saveCurrentRatios();
  rows.splice(i, 1);
  renderRows();
  calc();
}

/* ─── 계산 ─── */
let lastResults = [];

function calcMix(tabIdx) {
  const proc  = parseNum(document.getElementById('proc')?.value);
  const bag   = parseNum(document.getElementById('bag')?.value);
  const trans = parseNum(document.getElementById('trans')?.value);
  const extra = parseNum(document.getElementById('extra')?.value);
  const del   = parseNum(document.getElementById('del')?.value);

  let sumR = 0, sumA = 0;
  rows.forEach((row, i) => {
    const price = parseNum(row.price);
    const ratio = parseFloat(row.r[tabIdx]) || 0;
    const amt   = price * ratio / 100;
    sumR += ratio;
    sumA += amt;
    if (tabIdx === activeTab) {
      const el = document.getElementById(`r_amt_${i}`);
      if (el) el.textContent = amt > 0 ? fmt(amt) : '-';
    }
  });

  const total  = sumA + proc + bag + trans;
  const profit = del > 0 ? del - total : null;

  if (tabIdx === activeTab) {
    document.getElementById('sm_pct').textContent   = sumR > 0 ? sumR.toFixed(1) + '%' : '-';
    document.getElementById('sm_sub').textContent   = sumA > 0 ? fmt(sumA) : '-';
    document.getElementById('sm_total').textContent = total > 0 ? fmt(total) : '-';
    document.getElementById('warnMain').classList.toggle('on', sumR > 0 && Math.abs(sumR - 100) > 0.05);

    const hintEl = document.getElementById('sm_hint');
    hintEl.textContent = (total > 0 && extra > 0)
      ? `납품단가 참고: ${fmt(total)} + ${fmt(extra)} = ${fmt(total + extra)}`
      : '';

    const profEl = document.getElementById('sm_profit');
    if (profit !== null) {
      profEl.textContent = fmt(profit);
      profEl.style.color = profit >= 0 ? 'var(--orange)' : '#c62828';
    } else {
      profEl.textContent = '-';
      profEl.style.color = 'var(--muted)';
    }
  }

  return { sumR, total, profit, del };
}

function calc() {
  lastResults = Array.from({length: MIX_COUNT}, (_, i) => calcMix(i));
  renderComparison(lastResults);
}

function renderComparison(results) {
  const body = document.getElementById('cmpBody');
  body.innerHTML = results.map((r, i) => {
    const isActive   = i === activeTab;
    const hasData    = r.total > 0;
    const profitCls  = r.profit !== null ? (r.profit >= 0 ? 'profit-pos' : 'profit-neg') : 'muted';
    const marginStr  = (r.profit !== null && r.del > 0)
      ? `${(r.profit / r.del * 100).toFixed(1)}%` : '-';
    return `<tr class="${isActive ? 'active-row' : ''}">
      <td>${getMixName(i)}</td>
      <td class="${hasData ? '' : 'muted'}">${hasData ? fmt(r.total) : '-'}</td>
      <td class="${r.profit !== null ? profitCls : 'muted'}">${r.profit !== null ? fmt(r.profit) : '-'}</td>
      <td class="${r.profit !== null ? profitCls : 'muted'}">${marginStr}</td>
    </tr>`;
  }).join('');
}

/* ─── 탭 전환 ─── */
function switchMix(n) {
  saveCurrentRatios();
  activeTab = n;
  renderRows();
  updateMixHead();
  calc();
}

/* ─── 초기화 ─── */
function resetAll() {
  if (!confirm('모든 입력값을 초기화할까요?')) return;
  rows = INIT_ROWS.map(name => ({ name, price: '', r: Array(MIX_COUNT).fill('') }));
  activeTab = 0;
  mixNames = Array(MIX_COUNT).fill(null);
  renderRows();
  ['proc','bag','trans','extra','del'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
  updateMixHead();
  calc();
}

/* ─── 임시저장 ─── */
const SAVE_KEY      = 'bct_slot_';
const SAVE_NAME_KEY = 'bct_slot_name_';
const SLOT_COUNT    = 9;

function getSlotName(i) {
  return localStorage.getItem(SAVE_NAME_KEY + i) || `슬롯 ${i + 1}`;
}
function renameSlot(i) {
  const current = getSlotName(i);
  const next = prompt(`슬롯 ${i + 1} 이름 변경`, current);
  if (next === null) return;
  const name = next.trim() || `슬롯 ${i + 1}`;
  if (name === `슬롯 ${i + 1}`) {
    localStorage.removeItem(SAVE_NAME_KEY + i);
  } else {
    localStorage.setItem(SAVE_NAME_KEY + i, name);
  }
  renderSlots();
}

function getState() {
  saveCurrentRatios();
  return {
    rows:      rows.map(r => ({...r, r: [...r.r]})),
    activeTab,
    mixNames:  [...mixNames],
    proc:  String(document.getElementById('proc')?.value  || '').replace(/,/g, ''),
    bag:   String(document.getElementById('bag')?.value   || '').replace(/,/g, ''),
    trans: String(document.getElementById('trans')?.value || '').replace(/,/g, ''),
    extra: String(document.getElementById('extra')?.value || '').replace(/,/g, ''),
    del:   String(document.getElementById('del')?.value   || '').replace(/,/g, ''),
  };
}
function applyState(state) {
  rows = state.rows.map(r => {
    if (!r.r) r.r = [r.r1 || '', r.r2 || '', '', '', ''];
    return {...r, r: [...r.r]};
  });
  activeTab = state.activeTab ?? 0;
  // 배합 이름 복원 — 인메모리 배열 직접 덮어씀
  if (state.mixNames) {
    state.mixNames.forEach((name, i) => {
      mixNames[i] = name || null;
    });
  } else {
    mixNames = Array(MIX_COUNT).fill(null);
  }
  renderRows();
  updateMixHead();
  ['proc','bag','trans','extra','del'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = fmtInput(state[id] || '');
  });
  calc();
}

function saveToSlot(slot) {
  const existing = localStorage.getItem(SAVE_KEY + slot);
  if (existing) {
    const prev = JSON.parse(existing);
    if (!confirm(`"${getSlotName(slot)}"에 이미 저장된 데이터가 있습니다.\n(${prev.savedAt})\n덮어쓸까요?`)) return;
  }
  const state = getState();
  const now = new Date(), pad = n => String(n).padStart(2, '0');
  state.savedAt = `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  localStorage.setItem(SAVE_KEY + slot, JSON.stringify(state));
  renderSlots();
}
function loadFromSlot(slot) {
  const raw = localStorage.getItem(SAVE_KEY + slot);
  if (!raw) return;
  if (!confirm(`"${getSlotName(slot)}"을 불러오면 현재 입력값이 사라집니다. 계속할까요?`)) return;
  applyState(JSON.parse(raw));
  closeSaveModal();
}
function deleteSlot(slot) {
  if (!confirm(`"${getSlotName(slot)}" 저장 데이터를 삭제할까요?`)) return;
  localStorage.removeItem(SAVE_KEY + slot);
  renderSlots();
}
function renderSlots() {
  const list = document.getElementById('slotList');
  const penIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
  list.innerHTML = Array.from({length: SLOT_COUNT}, (_, i) => {
    const name = getSlotName(i);
    const raw  = localStorage.getItem(SAVE_KEY + i);
    const data = raw ? JSON.parse(raw) : null;
    return `
      <div class="slot-card">
        <div class="slot-info">
          <div class="slot-name">${name} <button class="slot-btn rename" onclick="renameSlot(${i})" style="padding:2px 6px;line-height:1">${penIcon}</button></div>
          <div class="slot-time" style="${data ? '' : 'color:#bbb'}">${data ? data.savedAt : '비어 있음'}</div>
        </div>
        <div class="slot-actions">
          <button class="slot-btn save" onclick="saveToSlot(${i})">저장</button>
          ${data ? `<button class="slot-btn load" onclick="loadFromSlot(${i})">불러오기</button>` : ''}
          ${data ? `<button class="slot-btn del"  onclick="deleteSlot(${i})">삭제</button>` : ''}
        </div>
      </div>`;
  }).join('');
}
function openSaveModal()    { renderSlots(); document.getElementById('saveModal').classList.add('on'); }
function closeSaveModal()   { document.getElementById('saveModal').classList.remove('on'); }
function onBackdropClick(e) { if (e.target === document.getElementById('saveModal')) closeSaveModal(); }

renderRows();
updateMixHead();
calc();
</script>
</body>
</html>
